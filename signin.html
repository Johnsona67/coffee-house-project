<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./home.css">
    <link rel="stylesheet" href="./auth.css">
    <title>Sign In - Coffee Shop</title>
</head>
<body>
    <div class="container-xl">
        <header>
            <nav>
                <div class="logo">
                    <a href="/index.html"><img src="/images/logo.png" alt="Coffee Shop Logo"></a>
                </div>
                <ul>
                    <li><a href="/index.html#Favourites-Coffee" class="action-link">Favorite coffee</a></li>
                    <li><a href="/index.html#About" class="action-link">About</a></li>
                    <li><a href="/index.html#Mobile-App" class="action-link">Mobile app</a></li>
                    <li><a href="/index.html#Footer" class="action-link">Contact us</a></li>
                </ul>
                <div class="menu_link">
                    <a href="/menu.html" class="action-link">Menu <img src="/images/coffee-cup.png" alt=""></a>
                </div>
            </nav>
        </header>

        <main class="auth-main">
            <div class="auth-container">
                <div class="auth-card">
                    <h1 class="auth-title">Sign In</h1>
                    <p class="auth-subtitle">Welcome back! Please sign in to your account.</p>
                    
                    <form id="signin-form" class="auth-form">
                        <div class="form-group">
                            <label for="login" class="form-label">Login</label>
                            <div class="input-container">
                                <input 
                                    type="text" 
                                    id="login" 
                                    name="login" 
                                    class="form-input" 
                                    placeholder="Enter your login"
                                    autocomplete="username"
                                >
                                <div class="input-icon error-icon" style="display: none;">⚠️</div>
                            </div>
                            <div class="error-message" id="login-error"></div>
                        </div>

                        <div class="form-group">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-container">
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    class="form-input" 
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                >
                                <div class="input-icon error-icon" style="display: none;">⚠️</div>
                            </div>
                            <div class="error-message" id="password-error"></div>
                        </div>

                        <div class="form-error" id="form-error" style="display: none;"></div>

                        <button type="submit" id="signin-btn" class="auth-btn" disabled>
                            Sign In
                        </button>
                    </form>

                    <div class="auth-footer">
                        <p>Don't have an account? <a href="/register.html" class="auth-link">Register here</a></p>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <section id="Footer" class="footer-content">
                <div class="footer-left">
                    <h2 class="heading-2">Sip, Savor, Smile. <span class="accent">It's coffee time!</span></h2>
                    <div class="socials">
                        <div class="footer-social twitter">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
                            <path
                                d="M23 3.01006C23 3.01006 20.9821 4.20217 19.86 4.54006C19.2577 3.84757 18.4573 3.35675 17.567 3.13398C16.6767 2.91122 15.7395 2.96725 14.8821 3.29451C14.0247 3.62177 13.2884 4.20446 12.773 4.96377C12.2575 5.72309 11.9877 6.62239 12 7.54006V8.54006C10.2426 8.58562 8.50127 8.19587 6.93101 7.4055C5.36074 6.61513 4.01032 5.44869 3 4.01006C3 4.01006 -1 13.0101 8 17.0101C5.94053 18.408 3.48716 19.109 1 19.0101C10 24.0101 21 19.0101 21 7.51006C20.9991 7.23151 20.9723 6.95365 20.92 6.68006C21.9406 5.67355 23 3.01006 23 3.01006Z"
                                stroke="currentColor"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            </svg>
                        </div>

                        <div class="footer-social instagram">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
                            <path
                                d="M12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16Z"
                                stroke="currentColor"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            <path
                                d="M3 16V8C3 5.23858 5.23858 3 8 3H16C18.7614 3 21 5.23858 21 8V16C21 18.7614 18.7614 21 16 21H8C5.23858 21 3 18.7614 3 16Z"
                                stroke="currentColor"
                            />
                            <path
                                d="M17.5 6.51L17.51 6.49889"
                                stroke="currentColor"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            </svg>
                        </div>

                        <div class="footer-social facebook">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
                            <path
                                d="M17 2H14C12.6739 2 11.4021 2.52678 10.4645 3.46447C9.52678 4.40215 9 5.67392 9 7V10H6V14H9V22H13V14H16L17 10H13V7C13 6.73478 13.1054 6.48043 13.2929 6.29289C13.4804 6.10536 13.7348 6 14 6H17V2Z"
                                stroke="currentColor"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="footer-right">
                    <h3 class="heading-3">Contact us</h3>
                    <div class="footer-right-info">
                        <div class="footer-location">
                            <a href="#" class="footer-link">
                            <img src="/images/pin-alt.png" alt="">
                            <span>8558 Green Rd., LA</span>
                            </a>
                        </div>

                        <div class="footer-phone">
                            <a href="#" class="footer-link">
                            <img src="/images/phone.png" alt="">
                            <span>+1 (603) 555-0123</span>
                            </a>
                        </div>

                        <div class="footer-event">
                            <a href="#" class="footer-link">
                            <img src="/images/clock.png" alt="">
                            <span>Mon-Sat: 9:00 AM – 23:00 PM</span>
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </footer>
    </div>

    <script type="module" src="/src/pages/signin.ts"></script>
</body>
</html>
